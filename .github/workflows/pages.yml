# Builds ui.wixzel.com and publishes it with GitHub Pages.
# One-time setup: Settings › Pages › Source: GitHub Actions, and a CNAME record
# for ui.wixzel.com pointing at wixzel.github.io.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap and structured data date each page by its last commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the React package type-checks against the tokens' built types.
      - run: pnpm build
      - run: pnpm check
      - run: pnpm --filter site build
        env:
          # Search Console and Bing verification. Set them under Settings ›
          # Secrets and variables › Actions › Variables; unset writes no tag.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell IndexNow (Bing, which ChatGPT search reads, plus Yandex and others)
  # about every page, so changes are indexed in minutes rather than weeks.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/site/public
      - name: Ping IndexNow
        run: |
          KEY=$(basename "$(ls apps/site/public/*.txt | grep -E '/[0-9a-f]{32}\.txt$')" .txt)
          URLS=$(curl -fsS https://ui.wixzel.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | jq -R . | jq -s .)
          jq -n --arg key "$KEY" --argjson urls "$URLS" \
            '{host: "ui.wixzel.com", key: $key, keyLocation: "https://ui.wixzel.com/\($key).txt", urlList: $urls}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d @- -o /dev/null -w 'IndexNow: %{http_code}\n'
