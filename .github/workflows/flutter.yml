name: Flutter

on:
  push:
    paths: ["packages/flutter/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["packages/flutter/**", ".github/workflows/flutter.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # The version the package is built and tested against (pubspec: flutter >=3.41).
          flutter-version: 3.41.7
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
